services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_db_password_123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_app -d identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=identity;Username=identity_app;Password=${DB_PASSWORD:-local_dev_db_password_123!}
      Email__SmtpHost: mailpit
      Email__SmtpPort: 1025
      Jwt__Issuer: https://identity.local/api
      Jwt__Audience: https://identity.local/api
      Jwt__KeyDirectory: /app/secrets
      Web__SiteUrl: http://localhost:3000
      Security__BffNetwork: 172.16.0.0/12
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-32_character_minimum_dev_secret_key_pass!!}
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal-net
      - public-net
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.7-alpine
    profiles:
      - tls
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public-net
    security_opt:
      - no-new-privileges:true

networks:
  internal-net:
    internal: true
  public-net:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
