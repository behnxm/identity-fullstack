name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: .NET 10 API & Security Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: identity_test
          POSTGRES_USER: identity_app
          POSTGRES_PASSWORD: test_password_123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore api/Identity.slnx

      - name: NuGet Security Audit
        run: dotnet list api/Identity.slnx package --vulnerable --include-transitive

      - name: Compile Solution (Zero Warnings)
        run: dotnet build api/Identity.slnx --configuration Release --no-restore -warnaserror

      - name: Run Unit, Architecture & Integration Tests
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=identity_test;Username=identity_app;Password=test_password_123!
          Email__SmtpHost: 127.0.0.1
          Email__SmtpPort: 1025
        run: dotnet test api/Identity.slnx --configuration Release --no-build --output Normal

  web-tests:
    name: Nuxt 4 BFF Typecheck & Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Active LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: npm ci --prefix web

      - name: TypeScript Typecheck (vue-tsc)
        run: npm run typecheck --prefix web

      - name: Vitest Suite (CSRF, Tokens, Proxy, Composables, Auth)
        run: npm test --prefix web

      - name: Build Web Application
        env:
          NUXT_SESSION_PASSWORD: 32_character_minimum_dev_secret_key_pass!!
        run: npm run build --prefix web

      - name: NPM Security Audit
        run: npm audit --prefix web --audit-level=high

  docker-verification:
    name: Docker & Compose Build Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build
